<headbar
    [route]="'/expenses'"
    [subhead]="'Dépense'"
    [title]="$expenseLabel | async"
/>
<section>
    @if ($expense | async; as expense) {
        <expense-header
            [date]="expense.getDate()"
            [counterparty]="expense.getCounterparty()"
        />
        <expense-images
            [avatarURL]="expense.getCounterparty().getAvatarURL()"
            [emoji]="expense.getEmoji()"
        />
        <expense-description
            [balance]="expense.getBalance()"
            [date]="expense.getDate()"
            [isDebt]="expense.isDebt()"
            [name]="expense.getCounterparty().getFullName()"
        />
        <expense-action
            [isDebt]="expense.isDebt()"
            (payback)="onPayback()"
        />
    } @else {
        <expense-skeleton/>
    }
</section>
