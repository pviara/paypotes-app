<main>
    <canvas id="gradient"></canvas>
    <section>
        <div class="top-part">
            <div class="logo">
                <img src="assets/icons/coin.png"/>
            </div>
            <div class="title">
                <h1 class="hyperbold">PayPotes</h1>
                <h2>Soyez sympa, rendez l'argent.</h2>
            </div>
        </div>
        <button
            [class.disabled]="$loading | async"
            [disabled]="$loading | async"
            (click)="signIn()">
            <img src="assets/icons/google.svg"/>
            @if ($loading | async) {
                Chargement...
            } @else {
                Se connecter avec&nbsp;<span class="bold">Google</span>
            }
        </button>
    </section>
    <p>
        <span class="bold">PayPotes</span> alpha-v{{ version }}
    </p>
    <div class="ellipses">
        <div></div>
        <div></div>
    </div>
</main>
