<section>
    <header>
        <h3 class="bold">Dépenses</h3>
        <a routerLink="/expenses">Tout voir</a>
    </header>
    @if ($noExpense | async) {
        <ul class="no-expense">
            <list-call-to-action/>
        </ul>
    } @else {
        <ul>
            @for (expense of $expenses | async; track $index) {
                <list-element [element]="expense"/>
            }
        </ul>
    }
</section>
