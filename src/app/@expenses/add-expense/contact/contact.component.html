<form [formGroup]="form">
    @if (notFoundUser) {
        <p class="error">Numéro introuvable</p>
    }
    <div class="input">
        <input
            type="tel"
            maxlength="14"
            placeholder="Entrez un N°..."
            formControlName="phone"
            phoneFormatModifier
            phonePasteModifier
        />
        @if (isLoading) {
            <span class="loader"></span>
        }
    </div>
</form>
