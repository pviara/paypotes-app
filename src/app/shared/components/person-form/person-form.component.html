<form>
    <div class="content">
        <manual-phone-input
            [error]="error"
            [isLoading]="searching"
            (searching)="onSearching($event)"
        />
        <div [ngClass]="{ searching }">
            <span>ou</span>
            <button
                type="button"
                [routerLink]="route()">
                🙋 {{ text() }}
            </button>
        </div>
    </div>
</form>
