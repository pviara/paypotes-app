<form [formGroup]="formGroup" (submit)="onButtonClicked()">
    <div class="content">
        <emoji-displayer 
            [emoji]="formGroup.controls[label].value"
        />
        <emoji-keyboard
            (keyClicked)="onKeyClicked($event)"
        />
    </div>
    <form-button
        [disabled]="formGroup.controls[label].invalid"
    />
</form>
