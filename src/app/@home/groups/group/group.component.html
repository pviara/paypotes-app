<div class="container">
    <li>
        @if (group(); as group) {
            <div class="emoji">
                {{ group.getEmoji() }}
            </div>
            <h3 class="bold">
                {{ group.getName() }}
            </h3>
            <p>
                {{ group.countMembers() }} personnes
            </p>
        } @else {
            <skeleton/>
        }
    </li>
</div>
