<form>
    <div class="content">
        <manual-name-input
            [error]="error"
            [$isLoading]="$searching"
            (searching)="onSearching($event)"
        />
        <div [ngClass]="{ searching: $searching | async }">
            <span>ou</span>
            <button
                type="button"
                [routerLink]="route()">
                🙋 {{ text() }}
            </button>
        </div>
    </div>
</form>
