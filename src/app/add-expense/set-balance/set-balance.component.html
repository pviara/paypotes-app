<div class="container">
    <headbar
        [subtitle]="'Nouvelle dépense'"
        [title]="'Fixer le montant'"
    />
    <form [formGroup]="form">
        <div class="content">
            <div class="balance">
                @if (form.controls.balance.value; as balance) {
                    <span>{{ balance }}</span>
                    <span>€</span>
                } @else {
                    <span class="placeholder">00,00</span>
                    <span class="placeholder">€</span>
                }
            </div>
            <balance-keyboard
                [keyboard]="formatter.getKeyboard()"
                (keyClicked)="onKeyClicked($event)"
            />
        </div>
        <form-button
            [disabled]="form.controls.balance.invalid"
            (clicked)="onButtonClicked()"
        />
    </form>
</div>
