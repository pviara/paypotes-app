<section>
    <header>
        <h3 class="bold">Dépenses</h3>
        <a>Tout voir</a>
    </header>
    <div class="content">
        @for (expense of expenses | async; track $index) {
            <div class="expense">
                <div class="description">
                    <span class="emoji">
                        {{ expense.getEmoji() }}
                    </span>
                    <h4>
                        {{ expense.getName() }}
                    </h4>
                </div>
                <h5>
                    {{ expense.getAmount() }}€
                </h5>
            </div>
        } 
    </div>
</section>
