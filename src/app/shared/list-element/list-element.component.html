<li [id]="randomId">
    @if (element(); as element) {
        @switch (elementType()) {
            @case ('contact') {
                contact description
            }
            @case ('expense') {
                expense description
            }
        }
        <balance
            [isDebt]="element.isDebt()"
            [balance]="element.formatBalance()"
        />
    } @else {
        <skeleton/>
    }
</li>
