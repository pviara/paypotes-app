<li (click)="onClicked()" [ngClass]="{ last: last(), selected: selected() }">
    <div class="info">
        <img
            id="image"
            class="avatar"
            [src]="person().getAvatarUrl()"
        />
        <div class="name">
            <span class="firstname">
                {{ person().getFirstname() }}
            </span>
            <span class="lastname">
                {{ person().getLastname() }}
            </span>
        </div>
    </div>
    <button>
        <img
            id="image"
            [src]="selected() ? 'assets/icons/check.png' : 'assets/icons/add.png'"
        />
    </button>
</li>
