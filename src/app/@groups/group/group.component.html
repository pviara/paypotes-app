<headbar
    [action]="action"
    [route]="'/groups'"
    [subhead]="'Groupes'"
    [title]="$groupName | async"
/>
<div>
    @if ($group | async; as group) {
        <balance
            [balance]="group.formatBalance()"
            [isDebt]="group.isDebt()"
        />
    }
    <explorer
        [$elements]="$expenses"
        (elementsRequested)="onExpensesRequested($event)"
    />
</div>
