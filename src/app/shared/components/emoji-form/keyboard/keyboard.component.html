<div class="container">
    <form [formGroup]="form" (keydown.enter)="onKeyboardEnter($event)">
        <input
            type="text"
            enterkeyhint="search"
            placeholder="Rechercher..."
            formControlName="search"
        />
    </form>
    <ul (scroll)="onScroll($event)">
        @for (key of filteredKeyboard; track $index) {
            <li (click)="onKeyClicked(key)">
                {{ key }}
            </li>
        }
    </ul>
    
</div>
