<div class="container">
    <headbar
        [route]="'/groups/add/members'"
        [subhead]="'Nouveau groupe > Membres'"
        [title]="'Ajouter'"
    />
    <form>
        <div class="content">
            <manual-phone-input
                [error]="error"
                [isLoading]="searching"
                (searching)="onSearching($event)"
            />
            <div [ngClass]="{ searching }">
                <span>ou</span>
                <button
                    routerLink="/groups/add/members/contacts"
                    type="button">
                    🙋 Choisir des contacts
                </button>
            </div>
        </div>
    </form>
</div>
