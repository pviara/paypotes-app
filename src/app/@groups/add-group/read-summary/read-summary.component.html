<div class="container">
    <headbar
        [route]="'/groups/add/members'"
        [subhead]="'Nouveau groupe'"
        [title]="'Résumé'"
    />
    <div class="content">
        <div class="emoji">
            {{ getEmoji() }}
        </div>
        <h1 class="bold">
            {{ getName() }}
        </h1>
        <p>
            {{ getMembers().length }} membres
        </p>
        <div class="members">
            @for (member of getMembers(); track $index) {
                <img [src]="member.getAvatarUrl()"/>
            }
        </div>
    </div>
    <form-button
        [disabled]="loading"
        [glowing]="true"
        [text]="'Créer le groupe'"
        (clicked)="addGroup()"
    />
</div>
