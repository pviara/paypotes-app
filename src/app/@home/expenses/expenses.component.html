<section>
    <header>
        <h3 class="bold">Dépenses</h3>
        <a>Tout voir</a>
    </header>
    <ul>
        @for (expense of $expenses | async; track $index) {
            @if (expense !== null) {
                <expense [expense]="expense"/>
            } @else {
                <expense [isLoading]="true"/>
            }
        }
    </ul>
</section>
