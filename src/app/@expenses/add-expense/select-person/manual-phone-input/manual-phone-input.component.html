<div>
    @if (notFoundUser && !isLoading) {
        <p class="error">Numéro introuvable...</p>
    }
    <div class="input">
        <input
            type="tel"
            maxlength="14"
            placeholder="Entrer un N°..."
            phoneFormatModifier
            [formControl]="control()"
            (change)="onChange($event)"
            (input)="onChange($event)"
        />
        @if (isLoading) {
            <span class="loader"></span>
        }
    </div>
</div>
