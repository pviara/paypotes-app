<li [id]="randomId" [ngClass]="{ loading: isLoading() }">
    @if (expense(); as expense) {
        <description
            [emoji]="expense.getEmoji()"
            [label]="expense.getLabel()"
            [isDebt]="expense.isDebt()"
            [origin]="expense.getOrigin()"
        />
        <total
            [isDebt]="expense.isDebt()"
            [total]="expense.formatTotal()"
        />
    } @else {
        <div class="skeleton">
            <div class="description">
                <div class="emoji"></div>
                <div class="textes">
                    <div class="label"></div>
                    <div class="origin"></div>
                </div>
            </div>
            <div class="total"></div>
        </div>
    }
</li>
