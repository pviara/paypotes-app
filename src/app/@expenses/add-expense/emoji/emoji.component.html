<div class="container">
    <div class="emoji">
        @if (emoji().value; as emoji) {
            <span>{{ emoji }}</span>
        } @else {
            <span>🔍</span>
        }
    </div>
    <div class="keyboard">
        <emoji-keyboard
            (keyClicked)="onKeyClicked($event)"
        />
    </div>
</div>
