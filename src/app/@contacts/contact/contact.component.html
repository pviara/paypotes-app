<headbar
    [route]="'/contacts'"
    [subhead]="'Contact'"
    [title]="$contactFullname | async"
/>
<div>
    @if ($contact | async; as contact) {
        <balance
            [balance]="contact.getBalance()"
            [isDebt]="contact.isDebt()"
        />
    }
    <explorer
        [$elements]="$expenses"
        (elementsRequested)="onExpensesRequested($event)"
    />
</div>
