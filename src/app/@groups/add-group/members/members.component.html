<div class="container">
    <headbar
        [route]="'/groups/add/emoji'"
        [subhead]="'Nouveau groupe'"
        [title]="'Membres'"
    />
    <div class="content">
        <ul>
            <add-member-button/>
            @for (member of getMembers(); track $index) {
                <member/>
            }
        </ul>
        <form-button
            [disabled]="form.getFieldFrom(label).invalid()"
        />
    </div>
</div>
