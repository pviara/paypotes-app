<div class="container">
    <headbar
        [route]="'/expenses/add/person'"
        [subhead]="'Nouvelle dépense'"
        [title]="'Lire le résumé'"
    />
    <div class="content">
        <expense-images
            [avatarURL]="getPersonAvatarURL()"
            [emoji]="getEmoji()"
        />
        <h1 class="bold">
            {{ getName() }}
        </h1>
        <p>
            @if (getIsCurrentPayer()) {
                Vous avez avancé à
                <br>
                <span class="bold">
                    {{ getPersonFullname() }}
                </span>
            } @else {
                <span class="bold">
                    {{ getPersonFullname() }}
                </span>
                <br>
                vous a avancé
            }
        </p>
        <h2 class="bold balance">
            {{ getBalance() }}€
        </h2>
    </div>
    <form-button
        [disabled]="loading"
        [text]="'Ajouter la dépense'"
        (clicked)="addExpense()"
    />
</div>
