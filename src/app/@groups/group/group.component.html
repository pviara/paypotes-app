<headbar
    [route]="''"
    [subtitle]="'Dépenses'"
    [title]="($group | async)?.getName()"
/>
<div>
    @if ($group | async; as group) {
        <balance
            [balance]="group.formatBalance()"
            [isDebt]="group.isDebt()"
        />
    }
    <explorer
        [$elements]="$expenses"
        (elementsRequested)="onExpensesRequested($event)"
    />
</div>
