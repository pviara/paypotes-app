<div class="container">
    <headbar
        [subtitle]="'Nouvelle dépense'"
        [title]="'Choisir un emoji'"
    />
    <form [formGroup]="form">
        <div class="content">
            <emoji-displayer 
                [emoji]="form.controls.emoji.value"
            />
        </div>
        <form-button
            [disabled]="form.controls.emoji.invalid"
        />
    </form>
</div>
