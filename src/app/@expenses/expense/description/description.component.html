<div>
    <h3>
        <span [ngClass]="balanceClass()">{{ sign() }}</span>{{ balance() }}
    </h3>
    <p>
        Le <span class="bold">{{ date() | formatDate }}</span>,
        @if (isDebt()) {
            {{ name() }}<br/> vous a avancé la somme de <span class="bold">{{ balance() }}</span>.
        } @else {
            vous avez avancé à {{ name() }} la somme de <span class="bold">{{ balance() }}</span>.
        }
    </p>
</div>
